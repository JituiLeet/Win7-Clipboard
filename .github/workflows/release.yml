name: Release Clipboard
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"
      release_name:
        description: "Release title"
        required: true
        default: "剪贴板 1.0.0"
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        platform: [x86, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: NuGet/setup-nuget@v2
      - name: Install .NET Framework 4.0 reference assemblies
        shell: pwsh
        run: |
          nuget install Microsoft.NETFramework.ReferenceAssemblies.net40 -Version 1.0.3 -OutputDirectory "$env:GITHUB_WORKSPACE\packages" -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw "NuGet reference-assembly installation failed." }
          $framework = Join-Path $env:GITHUB_WORKSPACE "packages/Microsoft.NETFramework.ReferenceAssemblies.net40.1.0.3/build/.NETFramework/v4.0"
          if (!(Test-Path (Join-Path $framework "mscorlib.dll"))) {
            Get-ChildItem "$env:GITHUB_WORKSPACE/packages" -Recurse -Filter mscorlib.dll | Select-Object -ExpandProperty FullName
            throw "The .NET Framework 4.0 reference assemblies were not found at the expected location."
          }
          "FRAMEWORK_PATH=$framework" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build
        shell: pwsh
        run: |
          msbuild Clipboard.csproj /m /t:Rebuild /verbosity:minimal /p:Configuration=Release /p:Platform=${{ matrix.platform }} /p:FrameworkPathOverride="$env:FRAMEWORK_PATH"
          if ($LASTEXITCODE -ne 0) { throw "MSBuild failed for ${{ matrix.platform }}." }
      - name: Verify output
        shell: pwsh
        run: |
          $exe = "bin/${{ matrix.platform }}/Release/Clipboard.exe"
          if (!(Test-Path $exe)) { throw "Expected build output was not created: $exe" }
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path "bin/${{ matrix.platform }}/Release/Clipboard.exe" -DestinationPath "artifacts/Clipboard-${{ matrix.platform }}.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: artifacts/Clipboard-${{ matrix.platform }}.zip
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-files
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: ${{ inputs.release_name }}
          generate_release_notes: true
          files: release-files/*.zip