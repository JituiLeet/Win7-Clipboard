name: Release Clipboard
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"
      release_name:
        description: "Release title"
        required: true
        default: "剪贴板 1.0.0"
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        platform: [x86, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: NuGet/setup-nuget@v2
      - name: Restore .NET Framework 4.0 reference assemblies
        run: nuget install Microsoft.NETFramework.ReferenceAssemblies.net40 -Version 1.0.3 -OutputDirectory packages -NonInteractive
      - name: Build
        shell: pwsh
        run: |
          $framework = "$env:GITHUB_WORKSPACE\packages\Microsoft.NETFramework.ReferenceAssemblies.net40.1.0.3\build\.NETFramework"
          msbuild Clipboard.csproj /m /t:Rebuild /p:Configuration=Release /p:Platform=${{ matrix.platform }} /p:TargetFrameworkRootPath="$framework"
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path "bin/${{ matrix.platform }}/Release/Clipboard.exe" -DestinationPath "artifacts/Clipboard-${{ matrix.platform }}.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: artifacts/Clipboard-${{ matrix.platform }}.zip
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-files
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: ${{ inputs.release_name }}
          generate_release_notes: true
          files: release-files/*.zip