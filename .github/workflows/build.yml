name: Build Clipboard
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        platform: [x86, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: NuGet/setup-nuget@v2
      - name: Restore .NET Framework 4.0 reference assemblies
        run: nuget install Microsoft.NETFramework.ReferenceAssemblies.net40 -Version 1.0.3 -OutputDirectory packages -NonInteractive
      - name: Build
        shell: pwsh
        run: |
          $framework = "$env:GITHUB_WORKSPACE\packages\Microsoft.NETFramework.ReferenceAssemblies.net40.1.0.3\build\.NETFramework"
          msbuild Clipboard.csproj /m /t:Rebuild /p:Configuration=Release /p:Platform=${{ matrix.platform }} /p:TargetFrameworkRootPath="$framework"
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path "bin/${{ matrix.platform }}/Release/Clipboard.exe" -DestinationPath "artifacts/Clipboard-${{ matrix.platform }}.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Clipboard-${{ matrix.platform }}
          path: artifacts/Clipboard-${{ matrix.platform }}.zip
          if-no-files-found: error
          retention-days: 30